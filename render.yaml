# HARZ Cloud v3.3 — Render Deployment Config
# Deploy at: https://dashboard.render.com → New → Web Service → Connect GitHub repo: rabiuhamza11/harz-cloud
# render.yaml auto-applies these settings

services:
  - type: web
    name: harz-cloud-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: HARZ_API_KEY
        value: harz_cloud_live_321424
      - key: OWNER_EMAIL
        value: hamzarabiu390@gmail.com
      - key: OWNER_PHONE
        value: 08028687857
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: GOOGLE_WEBHOOK_SECRET
        sync: false
      - key: NOTION_WEBHOOK_SECRET
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: harz_verify_321424
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:harzco.business@gmail.com
      - key: DB_TYPE
        value: file
      - key: DB_PATH
        value: ./data/harz-cloud.json
      - key: ENABLE_PUSH
        value: true
      - key: ENABLE_ANALYTICS
        value: true
      - key: ENABLE_SESSION_RECORDING
        value: true
      - key: ENABLE_CDN
        value: true
      - key: ENABLE_SSO
        value: true
      - key: ENABLE_WEBHOOKS
        value: true
      - key: ENABLE_ORCHESTRATION
        value: true
      - key: ENABLE_MEMORY
        value: true

  - type: cron
    name: harz-daily-backup
    env: node
    schedule: "0 1 * * *"
    buildCommand: npm install
    startCommand: node backup.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
