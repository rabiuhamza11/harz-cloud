# HARZ Cloud v20.0 — Render Deployment Config
# Primary backend: https://harz-cloud-backend.onrender.com
# Auto-deploys from GitHub: rabiuhamza11/harz-cloud-backend

services:
  - type: web
    name: harz-cloud-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: HARZ_API_KEY
        value: harz_cloud_live_321424
      - key: OWNER_EMAIL
        value: hamzarabiu390@gmail.com
      - key: OWNER_PHONE
        value: 08028687857
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: harz_verify_321424
      - key: DB_TYPE
        value: file
      - key: DB_PATH
        value: ./data/harz-cloud.json
      - key: ENABLE_PUSH
        value: true
      - key: ENABLE_ANALYTICS
        value: true
      - key: ENABLE_SSO
        value: true
      - key: ENABLE_WEBHOOKS
        value: true
      - key: ENABLE_MEMORY
        value: true

  - type: cron
    name: harz-daily-backup
    env: node
    schedule: "0 1 * * *"
    buildCommand: npm install
    startCommand: node backup.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
