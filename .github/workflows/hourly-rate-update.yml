name: Hourly Rate Update
on:
  schedule:
    # Every hour at :00
    - cron: '0 * * * *'
  workflow_dispatch: # Manual trigger

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Rate Updater
        run: |
          echo "Triggering Harz rate update..."
          RESPONSE=$(curl -s -w "\n%{http_code}" "https://harz-rate-updater.harz.workers.dev/update")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Rate update FAILED"
            exit 1
          fi
          
          # Check if status is success
          STATUS=$(echo "$BODY" | jq -r '.status')
          if [ "$STATUS" != "success" ]; then
            echo "Rate update returned error: $BODY"
            exit 1
          fi
          
          echo "Rate update SUCCESS"
          echo "$BODY" | jq '.rates'
      - name: Notify on failure
        if: failure()
        run: |
          echo "Rate update failed — check worker logs"
          # Could add Discord/Slack/Telegram notification here
