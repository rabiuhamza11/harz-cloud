name: Health Check
on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check All Endpoints
        run: |
          ENDPOINTS=(
            "https://harz-cloud.pages.dev/api/harz-exchange"
            "https://harz-cloud.pages.dev/api/dashboard"
            "https://harz-cloud.pages.dev/api/revenue-report"
            "https://harz-cloud.pages.dev/api/orders"
            "https://harz-cloud.pages.dev/api/paystack-webhook"
            "https://harz-cloud.pages.dev/api/paddle-webhook"
            "https://harz-cloud.pages.dev/api/gumroad-webhook"
            "https://harz-cloud.pages.dev/api/getly-webhook"
            "https://harz-cloud.pages.dev/api/payhip-webhook"
            "https://harz-rate-updater.harz.workers.dev/health"
          )
          
          FAILED=0
          
          for url in "${ENDPOINTS[@]}"; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ $url → $HTTP_CODE"
            else
              echo "❌ $url → $HTTP_CODE"
              FAILED=$((FAILED + 1))
            fi
          done
          
          echo ""
          echo "Total: ${#ENDPOINTS[@]} endpoints, $FAILED failed"
          
          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi
      - name: Notify on failure
        if: failure()
        run: |
          echo "One or more endpoints are DOWN"
          # Could add notification webhook here
